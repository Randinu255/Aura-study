<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AURA — Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            A
        </div>

        <span class="section-label">
            WELCOME BACK
        </span>

        <h1>
            Enter AURA.
        </h1>

        <p class="auth-description">
            Continue your 2028 A/L journey.
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <label>
                Username or Email
            </label>

            <input
                type="text"
                name="login"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Login →
            </button>

        </form>


        <p class="auth-footer">

            New to AURA?

            <a href="/register">
                Create account
            </a>

        </p>

    </div>

</div>

<footer style="
    text-align: center;
    margin-top: 28px;
    padding: 15px 10px;
    color: #6f7890;
    font-size: 11px;
    letter-spacing: 0.4px;
">
    Developed by <strong style="color:#aeb8d0;">Randinu Kadigawa</strong>
</footer>

</body>

</html>
