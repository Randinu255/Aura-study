<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AURA — Create Account</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            A
        </div>

        <span class="section-label">
            AURA ACCOUNT
        </span>

        <h1>
            Create your account.
        </h1>

        <p class="auth-description">
            Start building your 2028 A/L journey.
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                required
            >


            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                minlength="8"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                minlength="8"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Create Account →
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

<footer style="
    text-align: center;
    margin-top: 28px;
    padding: 15px 10px;
    color: #6f7890;
    font-size: 11px;
    letter-spacing: 0.4px;
">
    Developed by <strong style="color:#aeb8d0;">Randinu Kadigawa</strong>
</footer>

</body>

</html>
