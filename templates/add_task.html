<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AURA — Add Task</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        min-height: 100vh;

        color: #ffffff;

        background:
            radial-gradient(
                circle at top left,
                #1d2540 0,
                #0b0e17 45%,
                #070910 100%
            );

        padding: 25px 15px 50px;
    }


    /* =================================================
       PAGE
    ================================================= */

    .task-page {
        width: min(620px, 100%);
        margin: 0 auto;
    }


    /* =================================================
       CARD
    ================================================= */

    .task-form-card {

        padding: 28px;

        border-radius: 28px;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,0.10),
                rgba(255,255,255,0.035)
            );

        border:
            1px solid
            rgba(255,255,255,0.10);

        backdrop-filter: blur(22px);

        box-shadow:
            0 25px 70px
            rgba(0,0,0,0.30);
    }


    /* =================================================
       BACK BUTTON
    ================================================= */

    .back-button {

        display: inline-flex;

        align-items: center;

        gap: 6px;

        text-decoration: none;

        color: #9da6ba;

        font-size: 12px;

        font-weight: 700;

        padding: 9px 12px;

        border-radius: 11px;

        border:
            1px solid
            rgba(255,255,255,0.08);

        background:
            rgba(255,255,255,0.035);

        transition:
            0.2s ease;

        margin-bottom: 27px;
    }


    .back-button:hover {

        color: #ffffff;

        background:
            rgba(255,255,255,0.08);

        transform:
            translateX(-2px);
    }


    /* =================================================
       HEADER
    ================================================= */

    .section-label {

        display: block;

        color: #8d98b1;

        font-size: 10px;

        font-weight: 800;

        letter-spacing: 2px;

        margin-bottom: 9px;
    }


    h1 {

        font-size:
            clamp(29px, 7vw, 40px);

        line-height: 1.1;

        letter-spacing: -1px;

        margin-bottom: 9px;
    }


    .form-description {

        color: #929caf;

        font-size: 13px;

        line-height: 1.6;

        margin-bottom: 30px;
    }


    /* =================================================
       FORM
    ================================================= */

    form {

        display: flex;

        flex-direction: column;

        gap: 0;
    }


    label {

        display: block;

        color: #aeb6c8;

        font-size: 11px;

        font-weight: 800;

        letter-spacing: 0.8px;

        margin-bottom: 8px;

        text-transform: uppercase;
    }


    input,
    select,
    textarea {

        width: 100%;

        border: 1px solid
            rgba(255,255,255,0.10);

        outline: none;

        background:
            rgba(5,7,14,0.48);

        color: #ffffff;

        border-radius: 14px;

        font-family: inherit;

        font-size: 14px;

        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;

        margin-bottom: 20px;
    }


    input,
    select {

        height: 50px;

        padding: 0 15px;
    }


    textarea {

        min-height: 120px;

        resize: vertical;

        padding: 14px 15px;

        line-height: 1.5;

        margin-bottom: 25px;
    }


    input::placeholder,
    textarea::placeholder {

        color: #5f687c;
    }


    input:focus,
    select:focus,
    textarea:focus {

        border-color:
            rgba(151,166,255,0.55);

        background:
            rgba(10,13,25,0.72);

        box-shadow:
            0 0 0 3px
            rgba(129,150,255,0.08);
    }


    /* =================================================
       SELECT
    ================================================= */

    select {

        appearance: none;

        -webkit-appearance: none;

        cursor: pointer;

        background-image:
            linear-gradient(45deg,
                transparent 50%,
                #858fa6 50%),
            linear-gradient(135deg,
                #858fa6 50%,
                transparent 50%);

        background-position:
            calc(100% - 18px) 21px,
            calc(100% - 13px) 21px;

        background-size:
            5px 5px,
            5px 5px;

        background-repeat: no-repeat;

        padding-right: 40px;
    }


    select option {

        background: #10131e;

        color: #ffffff;
    }


    /* =================================================
       TIME GRID
    ================================================= */

    .time-grid {

        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }


    .time-grid input {

        margin-bottom: 20px;
    }


    /* =================================================
       SUBTLE FIELD GROUPS
    ================================================= */

    .time-grid > div {

        min-width: 0;
    }


    /* =================================================
       SUBMIT
    ================================================= */

    .submit-task {

        width: 100%;

        height: 54px;

        border: none;

        border-radius: 15px;

        background:
            linear-gradient(
                135deg,
                #ffffff,
                #cfd7ff
            );

        color: #080a10;

        font-family: inherit;

        font-size: 14px;

        font-weight: 900;

        letter-spacing: 0.2px;

        cursor: pointer;

        box-shadow:
            0 12px 30px
            rgba(130,150,255,0.18);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            opacity 0.2s ease;
    }


    .submit-task:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 16px 38px
            rgba(130,150,255,0.26);
    }


    .submit-task:active {

        transform:
            scale(0.98);
    }


    /* =================================================
       DESKTOP DECORATION
    ================================================= */

    .task-page::before {

        content: "";

        position: fixed;

        width: 260px;

        height: 260px;

        border-radius: 50%;

        background:
            rgba(105,125,255,0.08);

        filter: blur(70px);

        top: 10%;

        left: 50%;

        transform:
            translateX(-50%);

        pointer-events: none;

        z-index: -1;
    }


    /* =================================================
       MOBILE
    ================================================= */

    @media (max-width: 600px) {

        body {

            padding:
                12px 11px 35px;
        }


        .task-form-card {

            padding:
                22px 18px;

            border-radius:
                23px;
        }


        .back-button {

            margin-bottom:
                23px;
        }


        .form-description {

            margin-bottom:
                25px;
        }


        input,
        select {

            height:
                48px;

            font-size:
                13px;
        }


        textarea {

            min-height:
                105px;
        }


        .time-grid {

            gap:
                9px;
        }


        .submit-task {

            height:
                52px;
        }
    }


    @media (max-width: 360px) {

        .task-form-card {

            padding:
                20px 15px;
        }


        .time-grid {

            grid-template-columns:
                1fr;
        }

    }

</style>

</head><body><div class="task-page"><div class="task-form-card">


    <!-- BACK -->

    <a
        href="{{ url_for('home') }}"
        class="back-button"
    >
        ← Back to Dashboard
    </a>


    <!-- HEADER -->

    <span class="section-label">
        AURA PLANNER
    </span>


    <h1>
        Create a Task
    </h1>


    <p class="form-description">
        Plan the work. Execute the plan.
    </p>


    <!-- FORM -->

    <form method="POST">


        <!-- DATE -->

        <label>
            Date
        </label>

        <input
            type="date"
            name="date"
            required
        >


        <!-- SUBJECT -->

        <label>
            Subject
        </label>

        <select
            name="subject"
            required
        >

            <option value="">
                Select subject
            </option>

            <option value="Accounting">
                Accounting
            </option>

            <option value="ICT">
                ICT
            </option>

            <option value="Business Studies">
                Business Studies
            </option>

        </select>


        <!-- TASK -->

        <label>
            Task
        </label>

        <input
            type="text"
            name="title"
            placeholder="e.g. Accounting Chapter 03 revision"
            required
        >


        <!-- TIME -->

        <div class="time-grid">


            <div>

                <label>
                    Start
                </label>

                <input
                    type="time"
                    name="start_time"
                    required
                >

            </div>


            <div>

                <label>
                    End
                </label>

                <input
                    type="time"
                    name="end_time"
                    required
                >

            </div>


        </div>


        <!-- PRIORITY -->

        <label>
            Priority
        </label>

        <select name="priority">

            <option value="normal">
                Normal
            </option>

            <option value="high">
                High
            </option>

            <option value="critical">
                Critical
            </option>

        </select>


        <!-- NOTES -->

        <label>
            Notes
        </label>

        <textarea
            name="notes"
            placeholder="Optional notes..."
        ></textarea>


        <!-- SUBMIT -->

        <button
            type="submit"
            class="submit-task"
        >
            Create Task →
        </button>


    </form>


</div>

</div></body></html>
